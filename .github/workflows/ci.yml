name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
        # 这里故意不启用 npm 缓存：本插件只有 peerDependencies、没有 lockfile，
        # cache: npm 会让 setup-node 因「Dependencies lock file is not found」直接失败。
        # 测试通过桩模块运行，不需要 npm install。
      - name: Syntax checks
        run: |
          node --check lib/host.js
          node --check lib/state.js
          node --check lib/client.js
          node --check lib/orchestrator.js
          node --check lib/plan-store.js
          node --check lib/runtime.js
          node --check lib/audit.js
          node --check lib/explain.js
          node --check lib/pricing.js
          node --check lib/auto-plan.js
          node --check lib/catalog.js
          node --check lib/llm.js
          node --check lib/router.js
          node --check test/smoke.test.mjs
          node --check test/auto-plan.test.mjs
          node --check test/webserver-lifecycle.test.mjs
          node --check test/trust-contract.test.mjs
          node --check test/explain-audit.test.mjs
      - name: Unit tests
        run: |
          node test/smoke.test.mjs
          node test/auto-plan.test.mjs
          node test/webserver-lifecycle.test.mjs
          node test/trust-contract.test.mjs
          node test/explain-audit.test.mjs
      - name: Package check
        run: npm pack --dry-run
      - name: Diff hygiene
        run: git diff --check
