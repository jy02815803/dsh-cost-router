name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
        # 不启用 npm 缓存：本插件只有 peerDependencies、没有 lockfile，
        # cache: npm 会让 setup-node 因「Dependencies lock file is not found」直接失败。
        # 测试通过桩模块运行，不需要 npm install。
        # 运行时按 package.json 的 engines 覆盖 Node 20/22/24；
        # 测试里的同步模块钩子 registerHooks 从 Node 22.15 才提供，
        # 因此 Node 20 只跑运行时语法与不依赖模块桩的测试，
        # Node 22/24 跑全量测试。详见 test/README.md。
      - name: Runtime syntax checks (all supported runtimes)
        run: |
          for f in lib/*.js; do node --check "$f"; done
      - name: Test syntax checks
        if: matrix.node != '20'
        run: |
          for f in test/*.test.mjs; do node --check "$f"; done
      - name: Unit tests without module hooks
        run: |
          node test/smoke.test.mjs
          node test/explain-audit.test.mjs
          node test/quality-compat.test.mjs
          node test/visibility-control.test.mjs
      - name: Unit tests with DSH module stubs (Node >= 22.15)
        if: matrix.node != '20'
        run: |
          node test/auto-plan.test.mjs
          node test/webserver-lifecycle.test.mjs
          node test/trust-contract.test.mjs
          node test/quality-compat.test.mjs
          node test/visibility-control.test.mjs
      - name: Offline auto-plan evaluation
        if: matrix.node == '24'
        run: node scripts/evaluate-auto-plan.mjs
      - name: One-command test runner
        if: matrix.node == '24'
        run: npm test
      - name: Package check
        if: matrix.node == '24'
        run: npm pack --dry-run
      - name: Diff hygiene
        if: matrix.node == '24'
        run: git diff --check
