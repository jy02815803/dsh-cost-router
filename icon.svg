<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cost router">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- 源头 -->
  <circle cx="13" cy="32" r="6" fill="url(#g)"/>
  <!-- 三条分派路径 -->
  <path d="M19 32 H27" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M27 32 V15 H37" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M27 32 H37" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M27 32 V49 H37" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- 三个能力端点：便宜 / 中档 / 旗舰 -->
  <rect x="37" y="9" width="14" height="12" rx="4" fill="#FACC15"/>
  <rect x="37" y="26" width="14" height="12" rx="4" fill="#4ADE80"/>
  <rect x="37" y="43" width="14" height="12" rx="4" fill="#38BDF8"/>
  <!-- 汇总 -->
  <path d="M51 15 H55 V49 H51" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M51 32 H55" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="57" cy="32" r="4" fill="#A78BFA"/>
</svg>
